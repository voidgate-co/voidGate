# logban: ban CC attackers, scanners and brute-forcers by reading the
# nginx access log. Design and tuning: doc/logban.md.
#
# key = value, # starts a comment. costly, honey, skip, allow,
# allow_file, crawler, profile and watch may repeat.
#
# "profile <name>" and "watch <name>" declare one (spaces or tabs
# between the two words); "<name>.<key>" sets its keys. The default
# profile is built in and set with default.<key> only. A name is one
# profile or one watch, never both.

# Sliding window and how often it is judged, in seconds.
window = 60
step = 10

# A request is costly when its path (no query string) matches a costly
# regex, or its backend time (urt=, else rt=) is at least slow_seconds.
# 0 turns the time test off. Run with --top-paths 20 on a real log to
# see which paths cost the backend most.
costly = ^/search
costly = ^/api/report
costly = \.php$
slow_seconds = 0.5

# Profiles: the thresholds a request is judged by. Every request no
# other profile matched is judged by the default profile, below; it has
# no match line. Each profile counts its requests apart, per address,
# and has four keys: <name>.min_costly, .ratio, .max_backend_seconds
# and .attack_scale (attack mode, below).
#
# rule=ratio: in one window, the client's requests in that profile
# include at least min_costly costly ones AND at least `ratio` of them
# are costly. Browsers also load pages and assets, so their ratio stays
# well under 0.9. "off" turns the rule off.
#
# rule=backend: the client's requests in that profile used
# max_backend_seconds backend seconds or more in one window, whatever
# they asked for. 0 is off. Backend seconds / window = backend workers
# the client keeps busy: 30 is half a worker. Choose it from
# --top-clients on normal logs.
#
# The default profile. These are the built-in values: a line left out
# keeps its value, and a profile below that does not set a key gets the
# default's.
default.min_costly = 100
default.ratio = 0.9
default.max_backend_seconds = 0
default.attack_scale = 0.5      # attack mode only: min_costly 100 -> 50

# Other profiles are chosen per request by path (path:), user agent
# (ua:) or JA4 fingerprint (ja4:, needs ja4= in the log), first declared
# profile first. A key a profile does not set is the default profile's.
# Their rules carry their name, rule=api.backend; the default's do not.
# A user agent is free to forge, so a profile picks thresholds, never an
# exemption: a bot copying the app's user agent still meets
# api.max_backend_seconds.
# profile api = ua:^MyShop/
# profile api = path:^/api/v1/
# api.ratio = off                 # an app's ratio is ~1.0 by design
# api.max_backend_seconds = 30    # at most half a worker per address
#
# By JA4: your app's TLS stacks get app limits, any other stack calling
# the API strict ones. Take the fingerprints from --top-ja4; an exact
# ^...$ is a set lookup, so dozens are cheap.
# profile app = ja4:^t13d2014h2_a09f3c656075_14788d8d241b$
# app.ratio = off
# app.max_backend_seconds = 100
# profile api_other = path:^/api/
# api_other.min_costly = 20

# Honey paths: the site never serves them and no page links to them, so
# one request bans at once, for honey_ttl: 900 s, as long as max_ttl,
# and doubling on repeats if you raise max_ttl. Anchor
# with ^/ ; a pattern matching "/" is refused. Never list a linked path:
# prefetchers and mail link scanners follow links.
# honey = ^/(wp-login\.php|xmlrpc\.php|\.env|\.git(/|$))
# honey = ^/(phpmyadmin|pma|adminer)
# honey_ttl = 900                 # the default: max_ttl

# Watches: count, per address over the window, the requests matching all
# of a line's conditions (method:, path:, status: regexes; method and
# status match whole, so status:4.. is any 4xx). Ban at <name>.max;
# <name>.ratio also requires that share of the address's requests;
# <name>.ttl overrides ttl. Lines with one name OR.
# watch scan = status:404
# scan.max = 50
# scan.ratio = 0.5                # a NAT with broken images passes
# watch login = method:POST path:^/login$ status:401|403
# login.max = 20                  # only if the app answers 401/403
# login.ttl = 900                 # straight to the cap
# watch throttled = status:429    # limit_req sends 503 unless
# throttled.max = 30              # limit_req_status 429;

# Fingerprint clusters: a wide, slow botnet whose addresses each stay
# under every rule above, but share one JA4 + user agent (user agent
# alone without ja4= in the log) and send nearly only costly requests.
# A cluster fires at cluster_min_addresses addresses, cluster_min_costly
# costly requests and a cluster_ratio costly share in one window; its
# members with cluster_member_min costly requests and their own share of
# cluster_ratio are banned. Profiles with ratio off are left out.
# cluster_min_addresses = 10      # 0 is off
# cluster_min_costly = 300
# cluster_ratio = 0.9
# cluster_member_min = 3

# Attack mode: while the whole site's requests or backend seconds in one
# window reach attack_requests or attack_backend_seconds (0 is off), and
# for attack_hold seconds after, every profile's min_costly and
# max_backend_seconds are multiplied by its attack_scale: its own
# <name>.attack_scale if set, else default.attack_scale (0.5, in the
# default profile above); 1 keeps a profile's limits. The ratio is not
# scaled: browsers still pass on their mix of pages and assets. Bans
# that only the tighter limits fired say mode=attack. Set the thresholds
# above the "site peak" --top-clients prints for a normal week.
# attack_requests = 0
# attack_backend_seconds = 0
# attack_hold = 300
# api.attack_scale = 1            # an app's users: no tighter limits

# Paths not judged at all. Prefer a profile: skipped requests can never
# get anyone banned. Give them their own limit_req.
# skip = ^/health$

# Never banned. 127.0.0.0/8 and ::1 are always allowed. List your
# monitoring, office egress, and any load balancer that talks to nginx.
# allow = 192.0.2.0/24
# allow = 2001:db8::/32

# Files of never-banned networks, one CIDR per line, # comments.
# Re-read when replaced (checked every step); a broken update keeps the
# old list. Missing or broken at startup is an error. cdn_allow.py
# writes these.
# allow_file = /etc/logban/cdn-allow.txt

# Exempt a client whose reverse DNS ends in one of these AND resolves
# back to the same address. The user agent never exempts: it only
# decides whether DNS is asked. Only a client that sent a user agent
# matching crawler_ua is looked up, each lookup capped at
# crawler_timeout seconds; a reverse zone that never answers would
# otherwise hold up every ban.
# crawler_ua = (?i)bot|crawl|spider|slurp|google
# crawler_timeout = 1.0
# crawler = googlebot.com
# crawler = google.com
# crawler = search.msn.com
# crawler = crawl.yahoo.net
# crawler = applebot.apple.com

# First ban is ttl seconds, a minute: a false positive costs one, and a
# repeat offender doubles it, 60, 120, 240, 480, up to max_ttl. The
# count is forgotten once the address stays quiet for offense_memory
# after its last ban ended. Every ban, honey and watch ttls included, is
# capped at max_ttl, with a warning when one is set above it. 15
# minutes, so a mistake (a cleaned machine, a reassigned or CGNAT
# address) costs little, and a repeat offender is simply re-banned at
# its next offense. On a real log this let about 1 % more abusive
# traffic through than a day-long cap, with the same addresses banned.
ttl = 60
max_ttl = 900
offense_memory = 86400

# voidGate control socket. The user running logban needs access: root,
# or a member of ctl_socket_group in voidgate.conf.
# socket = /run/voidgate.sock

# JSON log lines (log_format escape=json) are read by field name. These
# are the defaults, nginx's variable names; several names are tried in
# order. Behind realip, point json_ip at realip_remote_addr.
# json_ip = remote_addr
# json_time = time_local, time_iso8601, msec
# json_request = request
# json_method = request_method          # with json_uri, when no request
# json_uri = request_uri, uri
# json_status = status
# json_ua = http_user_agent
# json_rt = request_time
# json_urt = upstream_response_time
# json_ja4 = ja4, http_ssl_ja4
