# SPDX-License-Identifier: Apache-2.0
# vim: filetype=nginx
# OpenResty + voidGate: ban abusive clients at XDP from Lua.
#
# The phases, and which voidGate call each one may use (doc/l7-bridge.md §9):
#
#   init_worker_by_lua   ngx.timer.every: a timer, so methods work there
#   access_by_lua        vg.ban_now(): sends at once, returns the answer
#   log_by_lua           vg.ban(): no cosocket here, so it queues a timer
#   content_by_lua       vg.status(), vg.drops(): methods, answer returned
#
# Before using it:
#   - install the client:  sudo make install-lua   (or set LUA_DIR)
#   - let the workers reach the daemon socket: in voidgate.conf set
#     ctl_socket_group to the worker group (nogroup / nobody / kong /
#     apisix), then restart voidgate
#   - point "upstream app" at your application
#   - every threshold and ttl below is an example: tune them
#
# If voidgate is not running, nginx itself logs every attempt as
#   [crit] connect() to unix:/run/voidgate.sock failed (2: No such file ...)
# (the health timer's, once a minute, and any ban's); a failed ban also
# logs a line of its own saying which ban failed. Start voidgate.
#
# Every ban needs a ttl and lifts itself; Lua cannot make a permanent drop.
# A ban drops ALL traffic from that address to this host (SSH on
# allow_ports excepted), not just the URI that triggered it.

worker_processes auto;

# error shows this config's own lines (ngx.ERR, a failed or refused ban) and
# nginx's failed connects to voidgate ([crit] socket missing, [error]
# refused). A stricter level (crit) hides the former; warn, notice, info or
# debug add per-request lines.
error_log logs/error.log error;

events {
    worker_connections 1024;
}

http {
    # Where resty/voidgate.lua lives (make install-lua puts it in OpenResty's
    # site lualib, already on the default path).
    lua_package_path "/usr/local/openresty/site/lualib/?.lua;;";

    # ban() sends an address at most once per window.
    lua_shared_dict voidgate_ban 1m;

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # Behind a CDN or load balancer, trust the client address only from it,
    # AND list its ranges in voidgate.conf allow_networks, or a forged header
    # bans your own front door:
    # set_real_ip_from 10.0.0.0/8;
    # real_ip_header   X-Forwarded-For;

    # With ja4_nginx_module, put the fingerprints in the access log for
    # offline aggregation (take the variable names from its README), then
    # ban with: voidgatectl drop <ip> ttl=<seconds>. contrib/logban reads
    # ja4= from its own format instead (doc/logban.md section 4.1).
    # log_format ja4 '$remote_addr [$time_local] "$request" $status '
    #                'ja4=$http_ssl_ja4 ja4t=$http_ssl_ja4t "$http_user_agent"';
    # access_log logs/access.log ja4;

    # A timer callback may use cosockets: check the daemon once a minute.
    # It logs nothing itself: a failed connect is logged by nginx's core
    # ([crit] "No such file", [error] "Connection refused") and a read
    # timeout by ngx_lua (unless lua_socket_log_errors is off).
    init_worker_by_lua_block {
        local vg = require("resty.voidgate")

        if ngx.worker.id() ~= 0 then
            return
        end

        local ok, err = ngx.timer.every(60, function(premature)  -- 1m
            if premature then
                return
            end

            vg.status()
        end)

        if not ok then
            ngx.log(ngx.ERR, "voidgate health timer: ", err)
        end
    }

    upstream app {
        server 127.0.0.1:3000;     # your application
    }

    server {
        listen 8080;

        # Rate limit; a client that keeps getting 429 is banned for 10 min.
        location / {
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://app;

            log_by_lua_block {
                if ngx.status == 429 then
                    local vg = require("resty.voidgate")
                    local ok, err = vg.ban(ngx.var.remote_addr, 600,  -- 10m
                                          { dict = "voidgate_ban" })
                    if not ok then
                        ngx.log(ngx.ERR, "voidgate ban: ", err)
                    end
                end
            }
        }

        # Honeypot: paths this site never serves. Ban at once in the access
        # phase (cosockets work here) and use the daemon's answer.
        location ~ ^/(wp-login\.php|xmlrpc\.php|\.env|\.git(/|$)) {
            access_by_lua_block {
                local vg = require("resty.voidgate")
                local ip = ngx.var.remote_addr
                local ok, err = vg.ban_now(ip, 86400)  -- 1d
                if not ok then
                    -- e.g. an allow_networks address: refused, not banned
                    ngx.log(ngx.ERR, "voidgate ban_now ", ip, ": ", err)
                end
                return ngx.exit(ngx.HTTP_FORBIDDEN)
            }
        }

        # Local status page: methods in the content phase.
        location = /voidgate/status {
            allow 127.0.0.1;
            deny  all;
            default_type text/plain;

            content_by_lua_block {
                local vg = require("resty.voidgate")

                local status, err = vg.status()
                if not status then
                    ngx.status = ngx.HTTP_SERVICE_UNAVAILABLE
                    ngx.say("voidgate: ", err)
                    return
                end

                ngx.say("state=", status.state, " prefixes=", status.prefixes,
                        " rx_pps=", status.rx_pps)

                for _, d in ipairs(vg.drops() or {}) do
                    ngx.say(d.cidr, " reason=", d.reason, " age=", d.age)
                end
            }
        }
    }
}
